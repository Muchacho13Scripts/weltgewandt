name: Upload Large File
on:
  repository_dispatch:
    types: [upload_large_file]

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download file
        # Lädt die URL herunter, die von Make.com übergeben wird
        run: curl -L "${{ github.event.client_payload.file_url }}" -o "deine_datei.zip"
      - name: Commit and push
        run: |
          git config user.name "GitHub Action API"
          git config user.email "action@github.com"
          git add deine_datei.zip
          git commit -m "Upload via Make.com and GitHub Action"
          git push
